<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Filter & Anime Effect (Non-AI)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        h1 {
            margin-bottom: 20px;
            font-size: 1.8rem;
            text-align: center;
        }
        .container {
            background-color: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 640px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .media-container {
            width: 100%;
            height: 380px;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }
        select, button, label.file-label {
            background-color: #334155;
            color: #fff;
            border: 1px solid #475569;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }
        select:hover, button:hover, label.file-label:hover {
            background-color: #475569;
        }
        input[type="file"] {
            display: none;
        }
        .btn-primary {
            background-color: #2563eb;
            border-color: #3b82f6;
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <h1>Photo Filter & Anime Effect (Non-AI)</h1>

    <div class="container">
        <div class="media-container">
            <video id="webcam" autoplay playsinline style="display: none;"></video>
            <img id="imagePreview" style="display: none;" alt="Preview">
            <canvas id="outputCanvas"></canvas>
        </div>

        <div class="controls">
            <button id="btnCamera">Buka Kamera</button>
            <label for="fileInput" class="file-label">Upload Gambar</label>
            <input type="file" id="fileInput" accept="image/*">
            
            <select id="filterSelect">
                <option value="normal">Normal</option>
                <option value="grayscale">Hitam Putih</option>
                <option value="sepia">Sepia</option>
                <option value="bright">Bright & Soft</option>
                <option value="anime">Anime / Comic (Non-AI)</option>
            </select>

            <button id="btnDownload" class="btn-primary">Download</button>
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const imgPreview = document.getElementById('imagePreview');
        const canvas = document.getElementById('outputCanvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        const filterSelect = document.getElementById('filterSelect');
        const btnCamera = document.getElementById('btnCamera');
        const fileInput = document.getElementById('fileInput');
        const btnDownload = document.getElementById('btnDownload');

        let currentSource = null; // 'video' atau 'image'
        let animationFrameId = null;

        canvas.width = 640;
        canvas.height = 480;

        // Akses Webcam
        btnCamera.addEventListener('click', async () => {
            stopSource();
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                currentSource = 'video';
                video.play();
                processFrame();
            } catch (err) {
                alert('Tidak dapat mengakses kamera: ' + err.message);
            }
        });

        // Unggah Gambar
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            stopSource();
            const reader = new FileReader();
            reader.onload = (event) => {
                imgPreview.onload = () => {
                    canvas.width = imgPreview.naturalWidth;
                    canvas.height = imgPreview.naturalHeight;
                    currentSource = 'image';
                    render();
                };
                imgPreview.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Event Listener Perubahan Filter
        filterSelect.addEventListener('change', () => {
            if (currentSource) render();
        });

        function stopSource() {
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            if (video.srcObject) {
                video.srcObject.getTracks().forEach(track => track.stop());
                video.srcObject = null;
            }
            currentSource = null;
        }

        function processFrame() {
            if (currentSource === 'video') {
                if (video.videoWidth) {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    render();
                }
                animationFrameId = requestAnimationFrame(processFrame);
            }
        }

        function render() {
            if (!currentSource) return;

            const sourceEl = currentSource === 'video' ? video : imgPreview;
            const selectedFilter = filterSelect.value;

            ctx.filter = 'none';
            ctx.drawImage(sourceEl, 0, 0, canvas.width, canvas.height);

            if (selectedFilter === 'grayscale') {
                ctx.filter = 'grayscale(100%)';
                ctx.drawImage(canvas, 0, 0);
            } else if (selectedFilter === 'sepia') {
                ctx.filter = 'sepia(100%)';
                ctx.drawImage(canvas, 0, 0);
            } else if (selectedFilter === 'bright') {
                ctx.filter = 'brightness(1.2) contrast(1.1) saturate(1.3)';
                ctx.drawImage(canvas, 0, 0);
            } else if (selectedFilter === 'anime') {
                applyAnimeFilter(ctx, canvas.width, canvas.height);
            }
        }

        // Algoritma Manipulasi Piksel Kartun/Anime (Sobel Edge + Posterization)
        function applyAnimeFilter(context, width, height) {
            const imgData = context.getImageData(0, 0, width, height);
            const data = imgData.data;
            const copy = new Uint8ClampedArray(data);

            // 1. Posterization (Meratakan Tingkat Warna)
            const levels = 5;
            const step = 255 / (levels - 1);

            for (let i = 0; i < data.length; i += 4) {
                data[i]     = Math.round(data[i] / step) * step;     // Red
                data[i + 1] = Math.round(data[i + 1] / step) * step; // Green
                data[i + 2] = Math.round(data[i + 2] / step) * step; // Blue
            }

            // 2. Edge Detection (Garis Outlines Hitam)
            const threshold = 70;
            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const idx = (y * width + x) * 4;
                    const rightIdx = (y * width + (x + 1)) * 4;
                    const bottomIdx = ((y + 1) * width + x) * 4;

                    const diffR = Math.abs(copy[idx] - copy[rightIdx]) + Math.abs(copy[idx] - copy[bottomIdx]);
                    const diffG = Math.abs(copy[idx + 1] - copy[rightIdx + 1]) + Math.abs(copy[idx + 1] - copy[bottomIdx + 1]);
                    const diffB = Math.abs(copy[idx + 2] - copy[rightIdx + 2]) + Math.abs(copy[idx + 2] - copy[bottomIdx + 2]);

                    if (diffR + diffG + diffB > threshold) {
                        data[idx] = 15;     // R
                        data[idx + 1] = 15; // G
                        data[idx + 2] = 15; // B
                    }
                }
            }

            context.putImageData(imgData, 0, 0);
        }

        // Download Hasil Filter
        btnDownload.addEventListener('click', () => {
            if (!currentSource) {
                alert('Silakan buka kamera atau upload gambar terlebih dahulu.');
                return;
            }
            const link = document.createElement('a');
            link.download = 'foto-anime-filter.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        });
    </script>
</body>
</html>
