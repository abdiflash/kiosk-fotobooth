<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="version" content="23.0">
    <title>Aplikasi Web - Versi 23</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .version-tag {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 0.75rem;
        }

        p {
            color: #94a3b8;
            margin-bottom: 1.5rem;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .btn {
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <main class="card">
        <span class="version-tag">Versi 23.0</span>
        <h1>Pembaruan Berhasil</h1>
        <p>Struktur HTML baru versi 23 telah dimuat. Silakan sesuaikan komponen atau logika khusus yang ingin ditambahkan.</p>
        <button class="btn" id="mainAction">Jalankan Sistem v23</button>
    </main>

    <script>
        // Logika Versi 23
        document.addEventListener('DOMContentLoaded', () => {
            const button = document.getElementById('mainAction');
            button.addEventListener('click', () => {
                console.log('Sistem versi 23 beroperasi normal.');
                alert('Versi 23 aktif dan berjalan lancar!');
            });
        });
    </script>
</body>
</html>
