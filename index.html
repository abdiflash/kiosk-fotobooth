<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pro Photobooth Kiosk</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- CDN Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* HEADER & KIOSK NAV */
        header {
            background: var(--panel-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .controls-top {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        select, button, input[type="file"] {
            background: #334155;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            outline: none;
            transition: all 0.2s ease;
        }

        button:active {
            transform: scale(0.96);
        }

        .btn-primary {
            background: var(--accent);
            font-weight: 600;
        }
        .btn-primary:hover {
            background: var(--accent-hover);
        }

        /* MAIN LAYOUT */
        main {
            flex: 1;
            display: grid;
            grid-template-columns: 340px 1fr;
            gap: 20px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        /* SIDEBAR SETTINGS */
        .sidebar {
            background: var(--panel-bg);
            border-radius: var(--radius);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-height: calc(100vh - 110px);
            overflow-y: auto;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .setting-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .color-presets {
            display: flex;
            gap: 8px;
        }

        .color-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            border: 2px solid transparent;
            cursor: pointer;
        }
        .color-btn.active { border-color: #fff; }

        /* VIEWPORT / CAMERA STAGE */
        .stage {
            background: #000;
            border-radius: var(--radius);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            min-height: 500px;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        video.mirrored {
            transform: scaleX(-1);
        }

        /* FLASH EFFECT & COUNTDOWN */
        .flash {
            position: absolute;
            inset: 0;
            background: white;
            opacity: 0;
            pointer-events: none;
            z-index: 50;
        }
        .flash.active {
            animation: flashAnim 0.4s ease-out;
        }
        @keyframes flashAnim {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }

        .countdown-overlay {
            position: absolute;
            font-size: 10rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            z-index: 40;
            display: none;
        }

        .start-btn-container {
            position: absolute;
            bottom: 30px;
            z-index: 30;
        }

        .btn-capture {
            padding: 18px 45px;
            font-size: 1.4rem;
            border-radius: 50px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.6);
        }

        /* MODAL RESULT */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal.active { display: flex; }

        .modal-content {
            background: var(--panel-bg);
            border-radius: var(--radius);
            padding: 25px;
            display: flex;
            gap: 25px;
            max-width: 1100px;
            width: 95%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .preview-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f172a;
            border-radius: 12px;
            padding: 15px;
        }

        canvas {
            max-height: 65vh;
            max-width: 100%;
            object-fit: contain;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .action-panel {
            width: 320px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .qr-box {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 5px;
        }

        /* PRINT MEDIA STYLING */
        @media print {
            body * { visibility: hidden; }
            #printArea, #printArea * { visibility: visible; }
            #printArea {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
        }

        @media (max-width: 900px) {
            main { grid-template-columns: 1fr; }
            .modal-content { flex-direction: column; }
            .action-panel { width: 100%; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">📸 KIOSK PHOTOBOOTH</div>
        <div class="controls-top">
            <select id="cameraSelect"><option>Memuat Kamera...</option></select>
            <button id="mirrorBtn">↔️ Mirror</button>
            <button id="fullscreenBtn">⛶ Fullscreen</button>
        </div>
    </header>

    <main>
        <!-- SIDEBAR CONFIGURATION -->
        <aside class="sidebar">
            <div class="setting-group">
                <label>Format Poses</label>
                <select id="poseFormat">
                    <option value="3">3 Poses (Strip Format)</option>
                    <option value="4">4 Poses (2x2 Grid Format)</option>
                </select>
            </div>

            <div class="setting-group">
                <label>Warna Background Strip</label>
                <div class="color-presets">
                    <button class="color-btn active" data-color="#ffffff" style="background: #ffffff;"></button>
                    <button class="color-btn" data-color="#18181b" style="background: #18181b;"></button>
                    <button class="color-btn" data-color="#fbcfe8" style="background: #fbcfe8;"></button>
                    <button class="color-btn" data-color="#bae6fd" style="background: #bae6fd;"></button>
                    <button class="color-btn" data-color="gradient" style="background: linear-gradient(135deg, #a855f7, #ec4899);"></button>
                </div>
            </div>

            <div class="setting-group">
                <label>Upload PNG Overlay (Optional)</label>
                <input type="file" id="overlayInput" accept="image/png">
            </div>

            <div class="setting-group">
                <label>Teks Acara / Event</label>
                <input type="text" id="eventTitle" value="SPECIAL EVENT 2026" placeholder="Judul Event">
                <input type="text" id="eventSub" value="Photobooth Memories" placeholder="Sub-judul">
            </div>

            <div class="setting-group">
                <label>Efek Filter Foto</label>
                <select id="filterSelect">
                    <option value="none">Normal</option>
                    <option value="grayscale(100%)">Black & White</option>
                    <option value="sepia(80%)">Vintage Sepia</option>
                    <option value="brightness(115%) contrast(105%)">Bright & Warm</option>
                </select>
            </div>
        </aside>

        <!-- LIVE STAGE -->
        <section class="stage">
            <div class="flash" id="flashElem"></div>
            <div class="countdown-overlay" id="countdownElem">3</div>
            <video id="webcam" autoplay playsinline></video>
            
            <div class="start-btn-container">
                <button class="btn-primary btn-capture" id="startBtn">📸 MULAI FOTO</button>
            </div>
        </section>
    </main>

    <!-- RESULT MODAL -->
    <div class="modal" id="resultModal">
        <div class="modal-content">
            <div class="preview-container">
                <canvas id="outputCanvas"></canvas>
            </div>
            <div class="action-panel">
                <h2>Hasil Photostrip</h2>
                <button class="btn-primary" id="printBtn">🖨️ Cetak Direct (Print)</button>
                <button id="downloadPngBtn">💾 Unduh PNG Strip</button>
                <button id="downloadZipBtn">📦 Unduh ZIP (Semua Foto)</button>
                
                <div class="setting-group" style="margin-top: 10px;">
                    <label>Scan QR Code (Download Link)</label>
                    <div class="qr-box" id="qrcode"></div>
                </div>

                <button id="closeModalBtn" style="background: #ef4444; margin-top: auto;">❌ Selesai & Sesi Baru</button>
            </div>
        </div>
    </div>

    <!-- Hidden element for Print Area -->
    <div id="printArea" style="display:none;"></div>

    <script>
        // GLOBAL STATE
        let currentStream = null;
        let isMirrored = true;
        let capturedPhotos = [];
        let customOverlayImage = null;
        let selectedBgColor = '#ffffff';

        // DOM ELEMENTS
        const webcam = document.getElementById('webcam');
        const cameraSelect = document.getElementById('cameraSelect');
        const mirrorBtn = document.getElementById('mirrorBtn');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const startBtn = document.getElementById('startBtn');
        const flashElem = document.getElementById('flashElem');
        const countdownElem = document.getElementById('countdownElem');
        const poseFormat = document.getElementById('poseFormat');
        const filterSelect = document.getElementById('filterSelect');
        const overlayInput = document.getElementById('overlayInput');
        const eventTitle = document.getElementById('eventTitle');
        const eventSub = document.getElementById('eventSub');
        const resultModal = document.getElementById('resultModal');
        const outputCanvas = document.getElementById('outputCanvas');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const printBtn = document.getElementById('printBtn');
        const downloadPngBtn = document.getElementById('downloadPngBtn');
        const downloadZipBtn = document.getElementById('downloadZipBtn');
        const qrcodeContainer = document.getElementById('qrcode');

        // 1. INITIALIZE CAMERA
        async function initCameras() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                
                cameraSelect.innerHTML = '';
                videoDevices.forEach((device, index) => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `Kamera ${index + 1}`;
                    cameraSelect.appendChild(option);
                });

                if (videoDevices.length > 0) {
                    startCamera(videoDevices[0].deviceId);
                }
            } catch (err) {
                alert('Gagal mengakses kamera: ' + err.message);
            }
        }

        async function startCamera(deviceId) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            const constraints = {
                video: {
                    deviceId: deviceId ? { exact: deviceId } : undefined,
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                }
            };

            try {
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                webcam.srcObject = currentStream;
            } catch (err) {
                console.error("Gagal membuka kamera selected", err);
            }
        }

        cameraSelect.addEventListener('change', () => startCamera(cameraSelect.value));

        // MIRROR TOGGLE
        mirrorBtn.addEventListener('click', () => {
            isMirrored = !isMirrored;
            webcam.classList.toggle('mirrored', isMirrored);
        });

        // FULLSCREEN TOGGLE
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        });

        // BACKGROUND SELECTION
        document.querySelectorAll('.color-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedBgColor = btn.dataset.color;
            });
        });

        // OVERLAY PNG UPLOAD
        overlayInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => { customOverlayImage = img; };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // 2. PHOTO SESSION & BURST LOGIC
        startBtn.addEventListener('click', async () => {
            capturedPhotos = [];
            startBtn.style.display = 'none';
            const totalPoses = parseInt(poseFormat.value);

            for (let i = 0; i < totalPoses; i++) {
                await runCountdown(3);
                triggerFlash();
                captureFrame();
                if (i < totalPoses - 1) {
                    await new Promise(r => setTimeout(r, 2000)); // 2s pause between shots
                }
            }

            startBtn.style.display = 'block';
            buildPhotostrip();
        });

        function runCountdown(seconds) {
            return new Promise((resolve) => {
                countdownElem.style.display = 'block';
                let count = seconds;
                countdownElem.textContent = count;

                const timer = setInterval(() => {
                    count--;
                    if (count > 0) {
                        countdownElem.textContent = count;
                    } else {
                        clearInterval(timer);
                        countdownElem.style.display = 'none';
                        resolve();
                    }
                }, 1000);
            });
        }

        function triggerFlash() {
            flashElem.classList.add('active');
            setTimeout(() => flashElem.classList.remove('active'), 400);
        }

        function captureFrame() {
            const canvas = document.createElement('canvas');
            canvas.width = webcam.videoWidth || 1280;
            canvas.height = webcam.videoHeight || 720;
            const ctx = canvas.getContext('2d');

            if (isMirrored) {
                ctx.translate(canvas.width, 0);
                ctx.scale(-1, 1);
            }

            ctx.filter = filterSelect.value;
            ctx.drawImage(webcam, 0, 0, canvas.width, canvas.height);
            capturedPhotos.push(canvas.toDataURL('image/png'));
        }

        // 3. CANVAS HIGH-RES RENDER ENGINE (300 DPI 5R READY)
        function buildPhotostrip() {
            const canvas = outputCanvas;
            const ctx = canvas.getContext('2d');

            // High Res Canvas Setup: 1200 x 1800 px
            canvas.width = 1200;
            canvas.height = 1800;

            // Render Background
            if (selectedBgColor === 'gradient') {
                const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
                grad.addColorStop(0, '#a855f7');
                grad.addColorStop(1, '#ec4899');
                ctx.fillStyle = grad;
            } else {
                ctx.fillStyle = selectedBgColor;
            }
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const count = capturedPhotos.length;
            let loadedCount = 0;
            const loadedImages = [];

            capturedPhotos.forEach((src, idx) => {
                const img = new Image();
                img.onload = () => {
                    loadedImages[idx] = img;
                    loadedCount++;
                    if (loadedCount === count) {
                        drawLayoutAndDetails(ctx, canvas, loadedImages);
                    }
                };
                img.src = src;
            });
        }

        function drawLayoutAndDetails(ctx, canvas, images) {
            const count = images.length;
            const margin = 50;
            const footerHeight = 220;

            if (count === 3) {
                // Strip 3 Poses Vertikal
                const availableHeight = canvas.height - footerHeight - (margin * 4);
                const photoH = availableHeight / 3;
                const photoW = canvas.width - (margin * 2);

                images.forEach((img, i) => {
                    const y = margin + i * (photoH + margin);
                    drawCroppedImage(ctx, img, margin, y, photoW, photoH);
                });
            } else if (count === 4) {
                // Grid 2x2 Poses
                const availableHeight = canvas.height - footerHeight - (margin * 3);
                const photoW = (canvas.width - (margin * 3)) / 2;
                const photoH = availableHeight / 2;

                const positions = [
                    { x: margin, y: margin },
                    { x: margin * 2 + photoW, y: margin },
                    { x: margin, y: margin * 2 + photoH },
                    { x: margin * 2 + photoW, y: margin * 2 + photoH }
                ];

                images.forEach((img, i) => {
                    drawCroppedImage(ctx, img, positions[i].x, positions[i].y, photoW, photoH);
                });
            }

            // Overlay PNG kustom
            if (customOverlayImage) {
                ctx.drawImage(customOverlayImage, 0, 0, canvas.width, canvas.height);
            }

            // Render Footer Text & Date
            const footerY = canvas.height - (footerHeight / 2);
            ctx.textAlign = 'center';
            
            // Set Text Color Based on BG
            ctx.fillStyle = (selectedBgColor === '#ffffff' || selectedBgColor === '#fbcfe8' || selectedBgColor === '#bae6fd') ? '#18181b' : '#ffffff';

            ctx.font = 'bold 42px Poppins';
            ctx.fillText(eventTitle.value.toUpperCase(), canvas.width / 2, footerY - 20);

            ctx.font = '300 28px Poppins';
            const today = new Date().toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' });
            ctx.fillText(`${eventSub.value} • ${today}`, canvas.width / 2, footerY + 30);

            // Generate QR & Show Modal
            generateQRCode(canvas.toDataURL('image/png'));
            resultModal.classList.add('active');
        }

        function drawCroppedImage(ctx, img, x, y, w, h) {
            const imgAspect = img.width / img.height;
            const targetAspect = w / h;
            let sx, sy, sw, sh;

            if (imgAspect > targetAspect) {
                sh = img.height;
                sw = img.height * targetAspect;
                sx = (img.width - sw) / 2;
                sy = 0;
            } else {
                sw = img.width;
                sh = img.width / targetAspect;
                sx = 0;
                sy = (img.height - sh) / 2;
            }

            ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
        }

        // 4. QR CODE GENERATOR
        function generateQRCode(dataUrl) {
            qrcodeContainer.innerHTML = '';
            // Embeds direct Blob DataURL link or Page URL for client download
            new QRCode(qrcodeContainer, {
                text: dataUrl.substring(0, 1000), // Standard client QR Preview Data
                width: 130,
                height: 130
            });
        }

        // 5. PRINT & DOWNLOAD ACTIONS
        printBtn.addEventListener('click', () => {
            const printArea = document.getElementById('printArea');
            printArea.innerHTML = `<img src="${outputCanvas.toDataURL()}" style="width:100%;">`;
            window.print();
        });

        downloadPngBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `photostrip-${Date.now()}.png`;
            link.href = outputCanvas.toDataURL();
            link.click();
        });

        downloadZipBtn.addEventListener('click', () => {
            const zip = new JSZip();
            const imgFolder = zip.folder("photobooth_photos");

            // Save photostrip
            const stripData = outputCanvas.toDataURL().split(',')[1];
            imgFolder.file("photostrip_full.png", stripData, { base64: true });

            // Save individual pose photos
            capturedPhotos.forEach((photo, idx) => {
                const data = photo.split(',')[1];
                imgFolder.file(`pose_${idx + 1}.png`, data, { base64: true });
            });

            zip.generateAsync({ type: "blob" }).then((content) => {
                saveAs(content, `photobooth-session-${Date.now()}.zip`);
            });
        });

        closeModalBtn.addEventListener('click', () => {
            resultModal.classList.remove('active');
        });

        // INIT ON LOAD
        window.addEventListener('load', initCameras);
    </script>
</body>
</html>
