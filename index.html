<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photobooth Web App</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            padding: 24px;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 24px;
        }

        .sidebar, .main-content {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
        }

        .card h2 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .webcam-container {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        #webcam {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #webcam.mirrored {
            transform: scaleX(-1);
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 10px 16px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--accent-hover);
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        input[type="file"] {
            width: 100%;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        input[type="file"]::file-selector-button {
            background: #334155;
            color: #fff;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
            transition: background 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background: #475569;
        }

        .canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            min-height: 500px;
        }

        #photoboothCanvas {
            max-width: 100%;
            max-height: 70vh;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .gallery-section {
            grid-column: 1 / -1;
        }

        #galleryGrid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            gap: 12px;
            margin-top: 12px;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- PANEL KIRI (KONTROL & KAMERA) -->
        <div class="sidebar">
            <!-- Kamera Realtime -->
            <div class="card">
                <h2>Kamera Realtime</h2>
                <div class="webcam-container">
                    <video id="webcam" autoplay playsinline class="mirrored"></video>
                </div>
                <button id="startBtn" class="btn" style="margin-top: 12px;">📸 Take Photo</button>
            </div>

            <!-- Kontrol File Upload -->
            <div class="card">
                <h2>Sumber Foto & Frame</h2>
                
                <div class="form-group">
                    <label for="frameInput">1. Frame PNG (Overlay)</label>
                    <input type="file" id="frameInput" accept="image/png">
                </div>

                <div class="form-group">
                    <label for="singlePhotoInput">2. Single Foto (Galeri)</label>
                    <input type="file" id="singlePhotoInput" accept="image/*">
                </div>

                <div class="form-group">
                    <label for="folderPhotoInput">3. Folder / Batch Foto</label>
                    <input type="file" id="folderPhotoInput" accept="image/*" webkitdirectory directory multiple>
                </div>
            </div>
        </div>

        <!-- PANEL KANAN (PREVIEW CANVAS) -->
        <div class="main-content">
            <div class="canvas-container">
                <canvas id="photoboothCanvas" width="600" height="800"></canvas>
            </div>
        </div>

        <!-- PANEL BUKTI FOTO (GALERI GRID) -->
        <div class="card gallery-section">
            <h2>Galeri Foto (Batch & Hasil Snap)</h2>
            <div id="galleryGrid">
                <span style="color: var(--text-muted); font-size: 0.85rem;">Belum ada foto di galeri.</span>
            </div>
        </div>
    </div>

    <script>
        // Inisialisasi aliran video kamera web saat halaman dibuka
        async function initCameraStream() {
            const videoElem = document.getElementById('webcam');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                });
                videoElem.srcObject = stream;
            } catch (err) {
                console.error("Gagal mengaktifkan kamera:", err);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initCameraStream();
        });
    </script>
    
    <!-- Panggil file logika JavaScript utama yang dibuat sebelumnya -->
    <script src="app.js"></script>
</body>
</html>
